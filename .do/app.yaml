name: lingua-bridge-api
region: blr
services:
  - name: api
    github:
      repo: sujayshah3011/Lingua-Bridge
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: npm install -g pnpm@latest && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    run_command: node --enable-source-maps artifacts/api-server/dist/index.mjs
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/healthz
    envs:
      - key: PORT
        value: "8080"
      - key: NODE_VERSION
        value: "22"
      - key: ELEVENLABS_API_KEY
        type: SECRET
      - key: SARVAM_API_KEY
        type: SECRET
      - key: FIREBASE_PROJECT_ID
        type: SECRET
      - key: FIREBASE_CLIENT_EMAIL
        type: SECRET
      - key: FIREBASE_PRIVATE_KEY
        type: SECRET
