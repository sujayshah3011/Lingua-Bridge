name: Keep Render API warm

# ponytail: Render's free plan spins the service down after 15 min idle and
# a cold start costs 30-60s on the next request — this ping just prevents
# that idle window, it does not remove the underlying free-tier limitation.
# Real fix: upgrade lingua-bridge-api to a paid Render plan (no spin-down).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: curl -fsS --max-time 25 https://lingua-bridge.onrender.com/api/healthz
